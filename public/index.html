<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Promo Finder</title>
<meta name="description" content="Upload a show's episode scripts and get a ranked list of ready-to-cut 20 to 60 second promos, with exact timestamps and a cut list.">
<script>
  // apply a saved light/dark choice before the page paints
  try { const t = localStorage.getItem('pf:theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
</script>
<meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#09090b" media="(prefers-color-scheme: dark)">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js" defer></script>
<script src="app.js" type="module"></script>
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="brand" href="./" id="home-link">
      <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true">
        <rect width="24" height="24" rx="6" fill="var(--fg)"/>
        <path d="M9.5 7H7v10h2.5M14.5 7H17v10h-2.5" fill="none" stroke="var(--bg)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="brand-name">Promo Finder</span>
    </a>
    <nav aria-label="Main">
      <button type="button" data-go="method">How it works</button>
      <button type="button" data-go="home">New run</button>
      <button type="button" class="icon-btn" id="theme-toggle" aria-label="Switch between light and dark"></button>
    </nav>
  </div>
</header>

<main class="wrap" id="app">
  <noscript><p>This page needs JavaScript to run.</p></noscript>
</main>

<footer>
  <div class="wrap">
    <span>Promo Finder</span>
    <span>Scripts go only to the model provider you pick. This site stores nothing.</span>
  </div>
</footer>
</body>
</html>
